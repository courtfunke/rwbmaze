<script>
  const GRID_SIZE = 6;
  const colorMap = { 'r': '#e53935', 'w': '#cccccc', 'b': '#1e88e5' };
  const colorOrder = ['r', 'w', 'b'];

  let hWalls = [];
  let vWalls = [];
  let currentPos = null;
  let colorIndex = 0;
  let startTime = null;
  let gameActive = false;
  let audioCtx = null;

  // Initialize dynamic arrays for 6x6 grid
  function initWallArrays() {
    hWalls = Array.from({ length: 5 }, () => Array(6).fill(null));
    vWalls = Array.from({ length: 6 }, () => Array(5).fill(null));
  }

  // Generate a random path from START (5,5) to FINISH (0,0) with guaranteed color order
  function generateSolvableMaze() {
    initWallArrays();

    // 1. Find a random valid path using DFS
    let path = [];
    let visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));

    function findPath(r, c) {
      visited[r][c] = true;
      path.push({ r, c });

      if (r === 0 && c === 0) return true; // Reached FINISH

      // Randomize neighbor directions (Up, Down, Left, Right)
      const neighbors = [
        { r: r - 1, c: c },
        { r: r + 1, c: c },
        { r: r, c: c - 1 },
        { r: r, c: c + 1 }
      ].filter(n => n.r >= 0 && n.r < GRID_SIZE && n.c >= 0 && n.c < GRID_SIZE && !visited[n.r][n.c]);

      // Shuffle directions for randomness
      neighbors.sort(() => Math.random() - 0.5);

      for (let next of neighbors) {
        if (findPath(next.r, next.c)) return true;
      }

      path.pop(); // Backtrack
      return false;
    }

    findPath(5, 5); // Start search from START space

    // 2. Assign Red -> White -> Blue order along the solution path
    let stepColorIdx = 0;
    for (let i = 0; i < path.length - 1; i++) {
      let curr = path[i];
      let next = path[i + 1];
      let targetColor = colorOrder[stepColorIdx];

      if (next.r < curr.r) hWalls[next.r][curr.c] = targetColor;      // Up
      else if (next.r > curr.r) hWalls[curr.r][curr.c] = targetColor; // Down
      else if (next.c < curr.c) vWalls[curr.r][next.c] = targetColor; // Left
      else if (next.c > curr.c) vWalls[curr.r][curr.c] = targetColor; // Right

      stepColorIdx = (stepColorIdx + 1) % 3;
    }

    // 3. Fill all remaining non-solution walls with random colors
    const randomColor = () => colorOrder[Math.floor(Math.random() * 3)];

    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 6; c++) {
        if (!hWalls[r][c]) hWalls[r][c] = randomColor();
      }
    }
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 5; c++) {
        if (!vWalls[r][c]) vWalls[r][c] = randomColor();
      }
    }
  }

  function playSound(type) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'error') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(130, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'win') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }
  }

  function buildBoard() {
    generateSolvableMaze(); // Generate a fresh random maze layout
    const board = document.getElementById('maze-board');
    board.innerHTML = '';

    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';

        // Apply internal wall border colors
        if (r > 0) cell.style.borderTopColor = colorMap[hWalls[r - 1][c]];
        if (r < GRID_SIZE - 1) cell.style.borderBottomColor = colorMap[hWalls[r][c]];
        if (c > 0) cell.style.borderLeftColor = colorMap[vWalls[r][c - 1]];
        if (c < GRID_SIZE - 1) cell.style.borderRightColor = colorMap[vWalls[r][c]];

        if (r === 0 && c === 0) {
          cell.textContent = 'FINISH';
          cell.classList.add('finish-cell');
        } else if (r === 5 && c === 5) {
          cell.textContent = 'START';
          cell.classList.add('start-cell');
        }

        cell.addEventListener('click', () => handleCellClick(r, c));
        board.appendChild(cell);
      }
    }
  }

  function handleCellClick(r, c) {
    if (r === 5 && c === 5) {
      startTime = new Date();
      currentPos = { r: 5, c: 5 };
      colorIndex = 0;
      gameActive = true;
      updateUI("Started! Next cross: RED line.");
      highlightCurrentCell();
      return;
    }

    if (!gameActive || !currentPos) return;

    const dr = Math.abs(currentPos.r - r);
    const dc = Math.abs(currentPos.c - c);

    if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
      let crossedColor = null;

      if (r < currentPos.r) crossedColor = hWalls[r][c];
      else if (r > currentPos.r) crossedColor = hWalls[currentPos.r][c];
      else if (c < currentPos.c) crossedColor = vWalls[r][c];
      else if (c > currentPos.c) crossedColor = vWalls[r][currentPos.c];

      if (crossedColor === colorOrder[colorIndex]) {
        currentPos = { r, c };
        colorIndex = (colorIndex + 1) % 3;
        const nextColor = colorIndex === 0 ? "RED" : colorIndex === 1 ? "WHITE" : "BLUE";

        if (r === 0 && c === 0) {
          const timeTaken = ((new Date() - startTime) / 1000).toFixed(1);
          playSound('win');
          updateUI(`🎉 Victory! Solved in ${timeTaken} seconds.`);
          gameActive = false;
        } else {
          updateUI(`Valid step! Next cross: ${nextColor} line.`);
        }
      } else {
        playSound('error');
        updateUI("❌ Incorrect color sequence! Reset to START.");
        currentPos = { r: 5, c: 5 };
        colorIndex = 0;
      }
      highlightCurrentCell();
    }
  }

  function highlightCurrentCell() {
    const cells = document.querySelectorAll('.cell');
    cells.forEach(c => c.classList.remove('active'));
    if (currentPos) {
      const index = currentPos.r * GRID_SIZE + currentPos.c;
      cells[index].classList.add('active');
    }
  }

  function updateUI(msg) {
    document.getElementById('status').textContent = msg;
  }

  document.getElementById('reset-btn').addEventListener('click', () => {
    currentPos = null;
    colorIndex = 0;
    gameActive = false;
    buildBoard(); // Regenerates a new maze layout on reset
    updateUI("New maze generated! Click START to begin.");
  });

  window.onload = buildBoard;

  </p>

  <div id="status">Click START to begin!</div>

  <button id="reset-btn">Reset Game</button>

  <script>
    const GRID_SIZE = 6;

    // Line colors: 'r' = Red, 'w' = White, 'b' = Blue
    // Guaranteed Solvable Horizontal Walls (5 rows x 6 columns)
const hWalls = [
  ['b', 'r', 'w', 'b', 'r', 'w'],
  ['w', 'b', 'r', 'w', 'b', 'r'],
  ['r', 'w', 'b', 'r', 'w', 'b'],
  ['b', 'r', 'w', 'b', 'r', 'w'],
  ['r', 'w', 'b', 'r', 'w', 'b']
];

// Guaranteed Solvable Vertical Walls (6 rows x 5 columns)
const vWalls = [
  ['r', 'w', 'b', 'r', 'w'],
  ['b', 'r', 'w', 'b', 'r'],
  ['w', 'b', 'r', 'w', 'b'],
  ['r', 'w', 'b', 'r', 'w'],

  ['r', 'w', 'b', 'r', 'w']

    const colorMap = { 'r': '#e53935', 'w': '#cccccc', 'b': '#1e88e5' };

        osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
    }

    function buildBoard() {
      const board = document.getElementById('maze-board');
      board.innerHTML = '';

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          // Set internal borders
          if (r > 0) cell.style.borderTopColor = colorMap[hWalls[r - 1][c]];
          if (r < GRID_SIZE - 1) cell.style.borderBottomColor = colorMap[hWalls[r][c]];
          if (c > 0) cell.style.borderLeftColor = colorMap[vWalls[r][c - 1]];
          if (c < GRID_SIZE - 1) cell.style.borderRightColor = colorMap[vWalls[r][c]];

          // Labels
          if (r === 0 && c === 0) {
            cell.textContent = 'FINISH';
            cell.classList.add('finish-cell');
          } else if (r === 5 && c === 5) {
            cell.textContent = 'START';
            cell.classList.add('start-cell');
          }

          cell.addEventListener('click', () => handleCellClick(r, c));
          board.appendChild(cell);
        }
      }
    }

    function handleCellClick(r, c) {
      if (r === 5 && c === 5) {
        startTime = new Date();
        currentPos = { r: 5, c: 5 };
        colorIndex = 0;
        gameActive = true;
        updateUI("Started! Next cross: RED line.");
        highlightCurrentCell();
        return;
      }

      if (!gameActive || !currentPos) return;

      const dr = Math.abs(currentPos.r - r);
      const dc = Math.abs(currentPos.c - c);

      // Must be adjacent step
      if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
        let crossedColor = null;

        if (r < currentPos.r) crossedColor = hWalls[r][c];
        else if (r > currentPos.r) crossedColor = hWalls[currentPos.r][c];
        else if (c < currentPos.c) crossedColor = vWalls[r][c];
        else if (c > currentPos.c) crossedColor = vWalls[r][currentPos.c];

        if (crossedColor === colorOrder[colorIndex]) {
          currentPos = { r, c };
          colorIndex = (colorIndex + 1) % 3;
          const nextColor = colorIndex === 0 ? "RED" : colorIndex === 1 ? "WHITE" : "BLUE";

          if (r === 0 && c === 0) {
            const timeTaken = ((new Date() - startTime) / 1000).toFixed(1);
            playSound('win');
            updateUI(`🎉 Victory! Solved in ${timeTaken} seconds.`);

            updateUI(`Valid step! Next cross: ${nextColor} line.`);

          updateUI("❌ Incorrect color sequence! Reset to START.");
          currentPos = { r: 5, c: 5 };
          colorIndex = 0;
        }

      }

    function highlightCurrentCell() {

  </script>
