<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red White Blue Line Maze</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    #status {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 15px 0;
      min-height: 30px;
    }
    /* 6x6 Grid Container */
    #maze-board {
      display: grid;
      grid-template-columns: repeat(6, 60px);
      grid-template-rows: repeat(6, 60px);
      background-color: #ffffff;
      border: 8px solid #2e7d32; /* Green outer boundary */
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .cell {
      width: 60px;
      height: 60px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
      background-color: #ffffff;
    }
    .cell.active {
      background-color: #fff9c4 !important;
    }
    .start-cell { background-color: #c8e6c9; }
    .finish-cell { background-color: #ffcdd2; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      background-color: #1976d2;
      color: white;
      border-radius: 4px;
    }
    button:hover { background-color: #1565c0; }
  </style>
</head>
<body>

  <h1>Red, White & Blue Maze</h1>
  <p>Sequence to cross: 
     <span style="color:red; font-weight:bold;">Red</span> &rarr; 
     <span style="color:gray; font-weight:bold;">White</span> &rarr; 
     <span style="color:blue; font-weight:bold;">Blue</span>
  </p>

  <div id="status">Click START to begin!</div>

  <div id="maze-board"></div>

  <button id="reset-btn">New Maze</button>

  <script>
    const GRID_SIZE = 6;
    const colorMap = { 'r': '#e53935', 'w': '#cccccc', 'b': '#1e88e5' };
    const colorOrder = ['r', 'w', 'b'];

    let hWalls = [];
    let vWalls = [];
    let currentPos = null;
    let colorIndex = 0;
    let startTime = null;
    let gameActive = false;
    let audioCtx = null;

    function initArrays() {
      hWalls = Array.from({ length: 5 }, () => Array(6).fill(null));
      vWalls = Array.from({ length: 6 }, () => Array(5).fill(null));
    }

    // Dynamic Generator: Guarantees a Solvable Path
    function generateSolvableMaze() {
      initArrays();
      let path = [];
      let visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));

      function findPath(r, c) {
        visited[r][c] = true;
        path.push({ r, c });

        if (r === 0 && c === 0) return true;

        const neighbors = [
          { r: r - 1, c: c },
          { r: r + 1, c: c },
          { r: r, c: c - 1 },
          { r: r, c: c + 1 }
        ].filter(n => n.r >= 0 && n.r < GRID_SIZE && n.c >= 0 && n.c < GRID_SIZE && !visited[n.r][n.c]);

        neighbors.sort(() => Math.random() - 0.5);

        for (let next of neighbors) {
          if (findPath(next.r, next.c)) return true;
        }

        path.pop();
        return false;
      }

      findPath(5, 5);

      // Color solution path in strict R -> W -> B order
      let stepColorIdx = 0;
      for (let i = 0; i < path.length - 1; i++) {
        let curr = path[i];
        let next = path[i + 1];
        let targetColor = colorOrder[stepColorIdx];

        if (next.r < curr.r) hWalls[next.r][curr.c] = targetColor;
        else if (next.r > curr.r) hWalls[curr.r][curr.c] = targetColor;
        else if (next.c < curr.c) vWalls[curr.r][next.c] = targetColor;
        else if (next.c > curr.c) vWalls[curr.r][curr.c] = targetColor;

        stepColorIdx = (stepColorIdx + 1) % 3;
      }

      // Fill remaining walls randomly
      const randomColor = () => colorOrder[Math.floor(Math.random() * 3)];
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 6; c++) {
          if (!hWalls[r][c]) hWalls[r][c] = randomColor();
        }
      }
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 5; c++) {
          if (!vWalls[r][c]) vWalls[r][c] = randomColor();
        }
      }
    }

    function playSound(type) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
    }

    function buildBoard() {
      generateSolvableMaze();
      const board = document.getElementById('maze-board');
      board.innerHTML = '';

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          const topBorder = r > 0 ? `4px solid ${colorMap[hWalls[r - 1][c]]}` : 'none';
          const bottomBorder = r < GRID_SIZE - 1 ? `4px solid ${colorMap[hWalls[r][c]]}` : 'none';
          const leftBorder = c > 0 ? `4px solid ${colorMap[vWalls[r][c - 1]]}` : 'none';
          const rightBorder = c < GRID_SIZE - 1 ? `4px solid ${colorMap[vWalls[r][c]]}` : 'none';

          cell.style.borderTop = topBorder;
          cell.style.borderBottom = bottomBorder;
          cell.style.borderLeft = leftBorder;
          cell.style.borderRight = rightBorder;

          if (r === 0 && c === 0) {
            cell.textContent = 'FINISH';
            cell.classList.add('finish-cell');
          } else if (r === 5 && c === 5) {
            cell.textContent = 'START';
            cell.classList.add('start-cell');
          }

          cell.addEventListener('click', () => handleCellClick(r, c));
          board.appendChild(cell);
        }
      }
    }

    function handleCellClick(r, c) {
      if (r === 5 && c === 5) {
        startTime = new Date();
        currentPos = { r: 5, c: 5 };
        colorIndex = 0;
        gameActive = true;
        updateUI("Started! Cross a RED line first.");
        highlightCurrentCell();
        return;
      }

      if (!gameActive || !currentPos) return;

      const dr = Math.abs(currentPos.r - r);
      const dc = Math.abs(currentPos.c - c);

      if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
        let crossedColor = null;

        if (r < currentPos.r) crossedColor = hWalls[r][c];
        else if (r > currentPos.r) crossedColor = hWalls[currentPos.r][c];
        else if (c < currentPos.c) crossedColor = vWalls[r][c];
        else if (c > currentPos.c) crossedColor = vWalls[r][currentPos.c];

        if (crossedColor === colorOrder[colorIndex]) {
          currentPos = { r, c };
          colorIndex = (colorIndex + 1) % 3;
          const nextColor = colorIndex === 0 ? "RED" : colorIndex === 1 ? "WHITE" : "BLUE";

          if (r === 0 && c === 0) {
            const timeTaken = ((new Date() - startTime) / 1000).toFixed(1);
            playSound('win');
            updateUI(`🎉 Solved in ${timeTaken} seconds!`);
            gameActive = false;
          } else {
            updateUI(`Valid move! Next cross: ${nextColor} line.`);
          }
        } else {
          playSound('error');
          updateUI("❌ Wrong color! Sent back to START.");
          currentPos = { r: 5, c: 5 };
          colorIndex = 0;
        }
        highlightCurrentCell();
      }
    }

    function highlightCurrentCell() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach(c => c.classList.remove('active'));
      if (currentPos) {
        const index = currentPos.r * GRID_SIZE + currentPos.c;
        cells[index].classList.add('active');
      }
    }

    function updateUI(msg) {
      document.getElementById('status').textContent = msg;
    }

    document.getElementById('reset-btn').addEventListener('click', () => {
      currentPos = null;
      colorIndex = 0;
      gameActive = false;
      buildBoard();
      updateUI("New maze generated! Click START to begin.");
    });

    document.addEventListener("DOMContentLoaded", buildBoard);
  </script>
</body>
</html>
