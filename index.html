<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red, White & Blue Maze Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            padding: 20px;
        }

        h1 {
            color: #1a252f;
            margin-bottom: 10px;
        }

        .instructions {
            margin-bottom: 15px;
            font-size: 16px;
            color: #4a5568;
            text-align: center;
        }

        .sequence-indicator {
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }
        .red { color: #d9381e; }
        .white { color: #888888; }
        .blue { color: #0044cc; }

        .game-container {
            position: relative;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        #maze-grid {
            position: relative;
            width: 500px;
            height: 500px;
            /* Embedded Maze Blank Image */
            background-image: url('Maze Blank.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: 3px solid #000;
        }

        .cell {
            position: absolute;
            width: 16.666%;
            height: 16.666%;
            cursor: pointer;
            transition: background-color 0.2s ease;
            box-sizing: border-box;
        }

        .cell:hover {
            background-color: rgba(255, 235, 59, 0.3);
        }

        .cell.active {
            background-color: rgba(76, 175, 80, 0.45);
            border: 2px solid #2e7d32;
        }

        .cell.error {
            background-color: rgba(244, 67, 54, 0.6);
        }

        #timer {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .modal-content button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0044cc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Red, White & Blue Maze</h1>
    <div class="instructions">
        Click spaces in sequence starting at <b>Start</b> and ending at <b>Finish</b>.<br>
        Cross lines in order: 
        <span class="sequence-indicator">
            <span class="red">RED</span> → <span class="white">WHITE</span> → <span class="blue">BLUE</span>
        </span>
    </div>

    <div class="game-container">
        <div id="maze-grid"></div>
    </div>

    <div id="timer">Time: 0.0s</div>

    <div id="modal">
        <div class="modal-content">
            <h2>Congratulations! 🎉</h2>
            <p id="win-message"></p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Exact solution sequence according to the numbered map (1 to 24 + Start/Finish)
        const targetSequence = [
            { r: 5, c: 5 }, // Start
            { r: 4, c: 5 }, // 1
            { r: 4, c: 4 }, // 3
            { r: 4, c: 3 }, // 4
            { r: 4, c: 2 }, // 5
            { r: 5, c: 2 }, // 6
            { r: 5, c: 1 }, // 7
            { r: 4, c: 1 }, // 8
            { r: 3, c: 1 }, // 9
            { r: 3, c: 2 }, // 10
            { r: 2, c: 2 }, // 11
            { r: 2, c: 1 }, // 12
            { r: 2, c: 0 }, // 13
            { r: 1, c: 0 }, // 14
            { r: 1, c: 1 }, // 15
            { r: 1, c: 2 }, // 16
            { r: 1, c: 3 }, // 17
            { r: 2, c: 3 }, // 18
            { r: 2, c: 4 }, // 19
            { r: 1, c: 4 }, // 20
            { r: 0, c: 4 }, // 21
            { r: 0, c: 3 }, // 22
            { r: 0, c: 2 }, // 23
            { r: 0, c: 1 }, // 24
            { r: 0, c: 0 }  // Finish
        ];

        let currentIndex = 0;
        let gameStarted = false;
        let startTime = null;
        let timerInterval = null;

        const gridContainer = document.getElementById('maze-grid');
        const timerDisplay = document.getElementById('timer');
        const modal = document.getElementById('modal');
        const winMessage = document.getElementById('win-message');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBuzzer() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playWinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.1);
                osc.stop(audioCtx.currentTime + i * 0.1 + 0.25);
            });
        }

        function createGrid() {
            gridContainer.innerHTML = '';
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 6; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.top = (r * 16.666) + '%';
                    cell.style.left = (c * 16.666) + '%';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => handleCellClick(r, c, cell));
                    gridContainer.appendChild(cell);
                }
            }
        }

        function startTimer() {
            if (!startTime) {
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                    timerDisplay.textContent = `Time: ${elapsed}s`;
                }, 100);
            }
        }

        function handleCellClick(r, c, cellElement) {
            const expected = targetSequence[currentIndex];

            if (r === expected.r && c === expected.c) {
                if (currentIndex === 0 && !gameStarted) {
                    gameStarted = true;
                    startTimer();
                }

                cellElement.classList.add('active');
                currentIndex++;

                if (currentIndex === targetSequence.length) {
                    clearInterval(timerInterval);
                    const totalTime = ((Date.now() - startTime) / 1000).toFixed(2);
                    playWinSound();
                    winMessage.textContent = `You solved the maze in ${totalTime} seconds!`;
                    modal.style.display = 'flex';
                }
            } else {
                if (gameStarted) {
                    playBuzzer();
                    cellElement.classList.add('error');
                    setTimeout(() => cellElement.classList.remove('error'), 300);
                    resetProgress();
                }
            }
        }

        function resetProgress() {
            currentIndex = 0;
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => cell.classList.remove('active'));
        }

        function resetGame() {
            modal.style.display = 'none';
            clearInterval(timerInterval);
            startTime = null;
            gameStarted = false;
            timerDisplay.textContent = 'Time: 0.0s';
            resetProgress();
        }

        createGrid();
    </script>
</body>
</html>
