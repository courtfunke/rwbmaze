<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red White Blue Line Maze</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; }
    p { margin-top: 5px; color: #555; }
    #status {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 15px 0;
      height: 30px;
    }
    /* 6x6 Grid Container */
    #maze-board {
      display: grid;
      grid-template-columns: repeat(6, 60px);
      grid-template-rows: repeat(6, 60px);
      background-color: #fff;
      padding: 5px;
      border: 8px solid #2e7d32; /* Green Outer Border */
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .cell {
      width: 60px;
      height: 60px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .cell.active {
      background-color: #fff9c4; /* Highlight current space */
    }
    .cell.visited {
      background-color: #e0f7fa;
    }
    .start-cell { background-color: #c8e6c9; }
    .finish-cell { background-color: #ffcdd2; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      background-color: #1976d2;
      color: white;
      border-radius: 4px;
    }
    button:hover { background-color: #1565c0; }
  </style>
</head>
<body>

  <h1>Red, White & Blue Maze</h1>
  <p>Move from <strong>START</strong> to <strong>FINISH</strong> by crossing lines in order: 
     <span style="color:red; font-weight:bold;">Red</span> &rarr; 
     <span style="color:gray; font-weight:bold;">White</span> &rarr; 
     <span style="color:blue; font-weight:bold;">Blue</span>
  </p>

  <div id="status">Click START to begin!</div>
  <div id="maze-board"></div>
  <button onclick="resetGame()">Reset Game</button>

  <script>
    const GRID_SIZE = 6;
    
    // Line Color Map for Internal Walls
    // 'r' = Red, 'w' = White, 'b' = Blue
    
    // Vertical Walls: 6 rows, 5 internal boundaries per row
    const vWalls = [
      ['r', 'w', 'b', 'r', 'w'],
      ['w', 'b', 'r', 'w', 'b'],
      ['b', 'r', 'w', 'b', 'r'],
      ['r', 'w', 'b', 'r', 'w'],
      ['w', 'b', 'r', 'w', 'b'],
      ['b', 'r', 'w', 'b', 'r']
    ];

    // Horizontal Walls: 5 internal boundaries rows, 6 columns per row
    const hWalls = [
      ['b', 'r', 'w', 'b', 'r', 'w'],
      ['r', 'w', 'b', 'r', 'w', 'b'],
      ['w', 'b', 'r', 'w', 'b', 'r'],
      ['b', 'r', 'w', 'b', 'r', 'w'],
      ['r', 'w', 'b', 'r', 'w', 'b']
    ];

    const colorMap = { 'r': '#e53935', 'w': '#e0e0e0', 'b': '#1e88e5' };
    const colorOrder = ['r', 'w', 'b'];

    let currentPos = null;
    let colorIndex = 0; // 0: Red next, 1: White next, 2: Blue next
    let startTime = null;
    let gameActive = false;

    // Web Audio Synthesizer for Effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
    }

    // Build the grid UI dynamically
    function buildBoard() {
      const board = document.getElementById('maze-board');
      board.innerHTML = '';

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;

          // Apply Border Styling based on internal walls
          const topColor = r > 0 ? colorMap[hWalls[r - 1][c]] : 'transparent';
          const bottomColor = r < GRID_SIZE - 1 ? colorMap[hWalls[r][c]] : 'transparent';
          const leftColor = c > 0 ? colorMap[vWalls[r][c - 1]] : 'transparent';
          const rightColor = c < GRID_SIZE - 1 ? colorMap[vWalls[r][c]] : 'transparent';

          cell.style.borderTop = r > 0 ? `4px solid ${topColor}` : 'none';
          cell.style.borderBottom = r < GRID_SIZE - 1 ? `4px solid ${bottomColor}` : 'none';
          cell.style.borderLeft = c > 0 ? `4px solid ${leftColor}` : 'none';
          cell.style.borderRight = c < GRID_SIZE - 1 ? `4px solid ${rightColor}` : 'none';

          // Set Labels
          if (r === 0 && c === 0) {
            cell.textContent = 'FINISH';
            cell.classList.add('finish-cell');
          } else if (r === 5 && c === 5) {
            cell.textContent = 'START';
            cell.classList.add('start-cell');
          }

          cell.addEventListener('click', () => handleCellClick(r, c));
          board.appendChild(cell);
        }
      }
    }

    function handleCellClick(r, c) {
      // Start Game Condition
      if (r === 5 && c === 5) {
        if (!startTime) startTime = new Date();
        currentPos = { r: 5, c: 5 };
        colorIndex = 0;
        gameActive = true;
        updateUI("Game started! Cross a RED line next.");
        return;
