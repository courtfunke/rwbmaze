<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red, White & Blue Maze Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    h1 {
      margin-bottom: 5px;
      color: #333;
    }
    p {
      margin-top: 0;
      margin-bottom: 15px;
      color: #666;
    }
    #game-container {
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    canvas {
      display: block;
      cursor: pointer;
    }
    #status {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <h1>Red, White & Blue Maze</h1>
  <p>Follow the sequence by clicking the correct path spaces from Start to Finish!</p>
  
  <div id="game-container">
    <canvas id="mazeCanvas" width="600" height="600"></canvas>
  </div>
  
  <div id="status">Click "Start" to begin!</div>

  <script>
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    const GRID_SIZE = 6;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    // Solution path mapped to row/col indices:
    // Cell index = row * 6 + col
    const solutionPath = [
      { r: 5, c: 5 }, // Start
      { r: 4, c: 5 }, // 1
      { r: 4, c: 4 }, // 2
      { r: 4, c: 3 }, // 3
      { r: 4, c: 2 }, // 4
      { r: 5, c: 2 }, // 5
      { r: 5, c: 1 }, // 6
      { r: 4, c: 1 }, // 7
      { r: 3, c: 1 }, // 8
      { r: 3, c: 2 }, // 9
      { r: 2, c: 2 }, // 10
      { r: 2, c: 1 }, // 11
      { r: 2, c: 0 }, // 12
      { r: 1, c: 0 }, // 13
      { r: 1, c: 1 }, // 14
      { r: 1, c: 2 }, // 15
      { r: 1, c: 3 }, // 16
      { r: 2, c: 3 }, // 17
      { r: 2, c: 4 }, // 18
      { r: 1, c: 4 }, // 19
      { r: 0, c: 4 }, // 20
      { r: 0, c: 3 }, // 21
      { r: 0, c: 2 }, // 22
      { r: 0, c: 1 }, // 23
      { r: 0, c: 0 }  // Finish
    ];

    // Maze walls grid definition
    // Types: 'blue', 'red', 'white', 'none'
    const hWalls = [
      // 7 horizontal wall lines (rows 0 to 6)
      ['blue', 'blue', 'blue', 'blue', 'blue', 'blue'],
      ['blue', 'none', 'blue', 'blue', 'white', 'red'],
      ['red', 'blue', 'blue', 'none', 'red', 'red'],
      ['blue', 'blue', 'red', 'blue', 'blue', 'blue'],
      ['red', 'red', 'blue', 'red', 'blue', 'white'],
      ['blue', 'red', 'white', 'white', 'blue', 'red'],
      ['blue', 'blue', 'blue', 'blue', 'blue', 'blue']
    ];

    const vWalls = [
      // 6 rows of 7 vertical wall lines
      ['blue', 'blue', 'white', 'red', 'blue', 'blue', 'blue'],
      ['blue', 'white', 'blue', 'red', 'blue', 'white', 'blue'],
      ['blue', 'blue', 'white', 'blue', 'none', 'white', 'blue'],
      ['blue', 'white', 'blue', 'blue', 'red', 'blue', 'blue'],
      ['blue', 'red', 'blue', 'red', 'blue', 'white', 'blue'],
      ['blue', 'white', 'blue', 'blue', 'red', 'red', 'blue']
    ];

    let currentStep = 0;
    let startTime = null;
    let timerInterval = null;
    let gameActive = false;

    // Web Audio API context for sound effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBuzzer() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function playWinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
      });
    }

    function drawMaze() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw cell backgrounds
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          ctx.fillStyle = '#dcdcdc'; // Neutral grey inner space background
          
          // Highlight clicked solution path
          for (let i = 0; i < currentStep; i++) {
            if (solutionPath[i].r === r && solutionPath[i].c === c) {
              ctx.fillStyle = '#a8e6cf'; // Highlight active step green
              break;
            }
          }

          ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      }

      // Draw Labels
      ctx.fillStyle = '#000';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Finish', 0 * CELL_SIZE + CELL_SIZE / 2, 0 * CELL_SIZE + CELL_SIZE / 2);
      ctx.fillText('Start', 5 * CELL_SIZE + CELL_SIZE / 2, 5 * CELL_SIZE + CELL_SIZE / 2);

      // Draw Wall Lines
      const wallThickness = 10;
      ctx.lineWidth = wallThickness;
      ctx.lineCap = 'square';

      // Horizontal Walls
      for (let r = 0; r <= GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const type = hWalls[r][c];
          if (type !== 'none') {
            ctx.strokeStyle = type;
            ctx.beginPath();
            ctx.moveTo(c * CELL_SIZE, r * CELL_SIZE);
            ctx.lineTo((c + 1) * CELL_SIZE, r * CELL_SIZE);
            ctx.stroke();
          }
        }
      }

      // Vertical Walls
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c <= GRID_SIZE; c++) {
          const type = vWalls[r][c];
          if (type !== 'none') {
            ctx.strokeStyle = type;
            ctx.beginPath();
            ctx.moveTo(c * CELL_SIZE, r * CELL_SIZE);
            ctx.lineTo(c * CELL_SIZE, (r + 1) * CELL_SIZE);
            ctx.stroke();
          }
        }
      }
    }

    function handleCanvasClick(event) {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const col = Math.floor(x / CELL_SIZE);
      const row = Math.floor(y / CELL_SIZE);

      const target = solutionPath[currentStep];

      if (row === target.r && col === target.c) {
        // Correct click
        if (currentStep === 0) {
          // First step: Start timer
          startTime = Date.now();
          gameActive = true;
          statusDiv.style.color = '#333';
          statusDiv.textContent = 'Game In Progress...';
        }

        currentStep++;

        if (currentStep === solutionPath.length) {
          // Completed maze
          playWinSound();
          const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
          statusDiv.style.color = 'green';
          statusDiv.textContent = `🎉 You won! Final Time: ${elapsed} seconds!`;
          gameActive = false;
        }
      } else {
        // Wrong click
        if (gameActive || currentStep > 0) {
          playBuzzer();
          currentStep = 0;
          gameActive = false;
          statusDiv.style.color = 'red';
          statusDiv.textContent = '❌ Wrong move! Resetting to Start...';
        }
      }

      drawMaze();
    }

    canvas.addEventListener('click', handleCanvasClick);

    // Initial render
    drawMaze();
  </script>
</body>
</html>
