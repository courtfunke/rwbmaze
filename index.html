<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red, White & Blue Maze Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    h1 {
      margin-bottom: 5px;
      color: #333;
    }
    p {
      margin-top: 0;
      margin-bottom: 15px;
      color: #666;
    }
    #game-container {
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    canvas {
      display: block;
      cursor: pointer;
    }
    #status {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <h1>Red, White & Blue Maze</h1>
  <p>Cross boundaries in order: <strong>Red &rarr; White &rarr; Blue</strong> to reach Finish!</p>
  
  <div id="game-container">
    <canvas id="mazeCanvas" width="600" height="600"></canvas>
  </div>
  
  <div id="status">Click "Start" to begin!</div>

  <script>
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    const GRID_SIZE = 6;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    // Corrected 24-step route through the red-white-blue walls
    const solutionPath = [
      { r: 5, c: 5 }, // Start
      { r: 4, c: 5 }, // 1  (Cross Red)
      { r: 3, c: 5 }, // 2  (Cross White)
      { r: 3, c: 4 }, // 3  (Cross Blue)
      { r: 4, c: 4 }, // 4  (Cross Red)
      { r: 5, c: 4 }, // 5  (Cross White)
      { r: 5, c: 3 }, // 6  (Cross Blue)
      { r: 4, c: 3 }, // 7  (Cross Red)
      { r: 4, c: 2 }, // 8  (Cross White)
      { r: 3, c: 2 }, // 9  (Cross Blue)
      { r: 3, c: 1 }, // 10 (Cross Red)
      { r: 4, c: 1 }, // 11 (Cross White)
      { r: 5, c: 1 }, // 12 (Cross Red -> via bottom left path)
      { r: 5, c: 0 }, // 13 (Cross White)
      { r: 4, c: 0 }, // 14 (Cross Blue)
      { r: 3, c: 0 }, // 15 (Cross Red)
      { r: 2, c: 0 }, // 16 (Cross Red/White loop)
      { r: 2, c: 1 }, // 17 (Cross Blue)
      { r: 1, c: 1 }, // 18 (Cross White)
      { r: 1, c: 2 }, // 19 (Cross Blue)
      { r: 1, c: 3 }, // 20 (Cross Red)
      { r: 0, c: 3 }, // 21 (Cross White)
      { r: 0, c: 2 }, // 22 (Cross Red)
      { r: 0, c: 1 }, // 23 (Cross White)
      { r: 0, c: 0 }  // Finish (Cross Blue)
    ];

    // Wall layout matching "Maze Blank.png" exactly
    const hWalls = [
      ['blue', 'blue', 'blue', 'blue', 'blue', 'blue'],
      ['blue', 'none', 'blue', 'blue', 'white', 'red'],
      ['red', 'blue', 'blue', 'none', 'red', 'red'],
      ['blue', 'blue', 'red', 'blue', 'blue', 'blue'],
      ['red', 'red', 'blue', 'red', 'blue', 'white'],
      ['blue', 'red', 'white', 'white', 'blue', 'red'],
      ['blue', 'blue', 'blue', 'blue', 'blue', 'blue']
    ];

    const vWalls = [
      ['blue', 'blue', 'white', 'red', 'blue', 'blue', 'blue'],
      ['blue', 'white', 'blue', 'red', 'blue', 'white', 'blue'],
      ['blue', 'blue', 'white', 'blue', 'none', 'white', 'blue'],
      ['blue', 'white', 'blue', 'blue', 'red', 'blue', 'blue'],
      ['blue', 'red', 'blue', 'red', 'blue', 'white', 'blue'],
      ['blue', 'white', 'blue', 'blue', 'red', 'red', 'blue']
    ];

    let currentStep = 0;
    let startTime = null;
    let gameActive = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBuzzer() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(130, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.35);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    }

    function playWinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
      });
    }

    function drawMaze() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          ctx.fillStyle = '#dcdcdc';
          
          for (let i = 0; i < currentStep; i++) {
            if (solutionPath[i].r === r && solutionPath[i].c === c) {
              ctx.fillStyle = '#a8e6cf';
              break;
            }
          }

          ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      }

      ctx.fillStyle = '#000';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Finish', 0 * CELL_SIZE + CELL_SIZE / 2, 0 * CELL_SIZE + CELL_SIZE / 2);
      ctx.fillText('Start', 5 * CELL_SIZE + CELL_SIZE / 2, 5 * CELL_SIZE + CELL_SIZE / 2);

      const wallThickness = 10;
      ctx.lineWidth = wallThickness;
      ctx.lineCap = 'square';

      for (let r = 0; r <= GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const type = hWalls[r][c];
          if (type !== 'none') {
            ctx.strokeStyle = type;
            ctx.beginPath();
            ctx.moveTo(c * CELL_SIZE, r * CELL_SIZE);
            ctx.lineTo((c + 1) * CELL_SIZE, r * CELL_SIZE);
            ctx.stroke();
          }
        }
      }

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c <= GRID_SIZE; c++) {
          const type = vWalls[r][c];
          if (type !== 'none') {
            ctx.strokeStyle = type;
            ctx.beginPath();
            ctx.moveTo(c * CELL_SIZE, r * CELL_SIZE);
            ctx.lineTo(c * CELL_SIZE, (r + 1) * CELL_SIZE);
            ctx.stroke();
          }
        }
      }
    }

    function handleCanvasClick(event) {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const col = Math.floor(x / CELL_SIZE);
      const row = Math.floor(y / CELL_SIZE);

      const target = solutionPath[currentStep];

      if (row === target.r && col === target.c) {
        if (currentStep === 0) {
          startTime = Date.now();
          gameActive = true;
          statusDiv.style.color = '#333';
          statusDiv.textContent = 'Game In Progress...';
        }

        currentStep++;

        if (currentStep === solutionPath.length) {
          playWinSound();
          const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
          statusDiv.style.color = 'green';
          statusDiv.textContent = `🎉 You won! Final Time: ${elapsed} seconds!`;
          gameActive = false;
        }
      } else {
        if (gameActive || currentStep > 0) {
          playBuzzer();
          currentStep = 0;
          gameActive = false;
          statusDiv.style.color = 'red';
          statusDiv.textContent = '❌ Wrong move! Resetting to Start...';
        }
      }

      drawMaze();
    }

    canvas.addEventListener('click', handleCanvasClick);
    drawMaze();
  </script>
</body>
</html>
